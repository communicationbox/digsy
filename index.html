<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Digsy World</title>
<meta name="description" content="Un piccolo archeologo, un mondo infinito, creature estinte da riportare alla luce.">
<!-- ICONA: la stessa faccia di Digsy in tab, in home e nel menu app (SVG nitido a ogni scala,
     PNG per iOS e Android che l'SVG non lo prendono sempre) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#241a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digsy">
<!-- ANTEPRIMA quando il link viene incollato (Reddit, Discord, WhatsApp, Telegram, Bluesky).
     Senza questi tag esce un rettangolo grigio vuoto, e su un sub di link l'anteprima è quasi
     tutto quello che si vede prima di decidere se cliccare. L'indirizzo dell'immagine va
     ASSOLUTO: i siti che generano l'anteprima non risolvono i percorsi relativi.
     Reddit tiene in cache l'anteprima per indirizzo: se si pubblica un link prima di avere
     questi tag, quel post resta senza miniatura per sempre. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Digsy World">
<meta property="og:description" content="A cozy game about digging up fossils of creatures that never existed. Free, in your browser, no sign-up.">
<meta property="og:image" content="https://digsy.dev-box.it/og.png">
<meta property="og:url" content="https://digsy.dev-box.it/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="frame">
    <canvas id="cv"></canvas>
    <div id="hud">
      <span class="tag" id="hudtoggle" title="Mostra/nascondi info">📊</span>
      <span class="tag hud-always" title="Monete">🪙 <span id="h-coin">0</span></span>
      <span class="tag hud-always" title="Energia (scavare costa 1)">⚡ <span id="h-en">0</span></span>
      <span class="tag" title="Giorno · orario">📅 <span id="h-day">1</span></span>
      <!-- LIVELLO: scritto "Lv", non un'icona. Il simbolo del tocco accademico finiva su un
           germoglio (EMAP) e accanto a un numero nessuno lo leggeva come "livello" — le due
           lettere le capiscono tutti, e sono le stesse dei cappelli premium (🔒 Lv5). -->
      <span class="tag" id="lvltag" title="Livello archeologo"><b class="lvab">Lv</b> <span id="h-lvl">1</span></span>
      <span class="tag" title="Zona in cui ti trovi"><span id="h-zone">…</span></span>
      <span class="tag" id="compasstag" title="Città"><span id="h-compass"></span></span>
      <span class="tag" id="questtag" title="Missioni (Q)" style="display:none;cursor:pointer">📋 <span id="h-quest">0</span></span>
      <span class="tag" id="companiontag" title="Compagno" style="display:none">🐾 <span id="h-comp"></span></span>
      <span class="tag hud-always" id="bagbtn" title="Apri lo zaino (I)">🎒 <span class="lbl">zaino </span><span id="h-bag">0</span></span>
      <!-- MAPPA sempre a portata: da tastiera basta M, ma su un telefono quel tasto non
           esiste e l'unica via era passare dallo zaino. `hud-always` la tiene visibile
           anche a barra ripiegata, come lo zaino. -->
      <span class="tag hud-always" id="mapbtn" title="Mappa del mondo (M)">🗺️<span class="lbl"> mappa</span></span>
      <span class="tag" id="menubtn" title="Menu (ESC)">☰<span class="lbl"> menu</span></span>
      <span class="tag" id="debugtag" style="display:none;background:rgba(140,60,60,.85)">🐞 CHEAT · NO SAVE</span>
    </div>
    <!-- TUTORIAL: un obiettivo alla volta, sotto la barra e fuori dal centro dello schermo.
         Il testo lo scrive ui.js (applyStaticTexts/updateHUD): qui niente parole murate. -->
    <div id="tutbox" style="display:none"></div>
    <div id="prompt"></div>
  <!-- USCITA: per uscire bisogna camminare OLTRE la porta, ma oltre la porta non c'è nulla
       da cliccare — col solo mouse era impossibile. Questo bottone compare avvicinandosi. -->
  <button id="exitbtn" type="button">🚪 Esci</button>
  <!-- ARREDO IN MANO (M4): compaiono solo mentre si sta ripiazzando un mobile raccolto. -->
  <div id="furnhold">
    <canvas id="furnholdpv" width="56" height="64"></canvas>
    <button id="furnrotbtn" type="button">Ruota</button>
    <button id="furncancelbtn" type="button">Annulla</button>
  </div>
    <!-- LA RIGA DELLA CHAT: compare solo in compagnia. Nessun testo qui dentro, nemmeno il
         segnaposto: lo mette applyStaticTexts, o resterebbe in italiano per tutti. -->
    <div id="chatbar">
      <input id="chati" type="text" maxlength="140" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
      <button id="chatsend" class="btn amber"></button>
    </div>
    <!-- IL SOGNO: chi dorme in compagnia aspetta qui. Vuoto: lo riempie dream.js, testi
         compresi, o resterebbero in una lingua sola. -->
    <div id="dream"></div>
    <div id="cmd">
      <div id="cmdout"></div>
      <div class="cmdrow"><span class="cmark">\</span><input id="cmdi" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><span id="cmdhint"></span></div>
    </div>
  </div>

  <div id="touch">
    <div id="joy"><div id="joyknob"></div></div>
    <div id="abtn">A</div>
  </div>

  <div id="modal"><div class="sheet">
    <div class="st"><h2 id="m-title">—</h2><span class="st-coins" id="m-coins"></span><button class="x" id="m-close">✕</button></div>
    <div class="sb" id="m-body"></div>
  </div></div>

  <div id="bagov"><div class="bagwrap" id="bagbox"></div></div>
  <!-- tavolo di preparazione: si spazzola via la crosta dal reperto grezzo -->
  <div id="prepov"><div id="prepbox">
    <div class="pr-hd"><span id="pr-title">PREPARAZIONE</span><button class="pr-x" id="pr-close">✕</button></div>
    <div class="pr-stage"><canvas id="pr-cv" width="224" height="192"></canvas></div>
    <div class="pr-tools">
      <button class="pr-tool on" id="pr-t-pennello" data-tool="pennello">Pennello</button>
      <button class="pr-tool" id="pr-t-scalpello" data-tool="scalpello">Scalpello</button>
      <button class="pr-tool" id="pr-t-spatola" data-tool="spatola">Spatola</button>
    </div>
    <div class="pr-meters">
      <div class="pr-meter"><span class="pr-mlab" id="pr-lab-clean">Pulizia</span><div class="pr-bar"><div class="pr-fill" id="pr-fill"></div></div></div>
      <div class="pr-meter"><span class="pr-mlab" id="pr-lab-integ">Integrità</span><div class="pr-bar"><div class="pr-fill integ" id="pr-integ" style="width:100%"></div></div></div>
    </div>
    <div class="pr-foot"><span id="pr-hint"></span><button class="btn amber" id="pr-done">Fatto</button></div>
  </div></div>
  <div id="tossov"><div id="tossbox">
    <div class="toss-hd" id="toss-title"></div>
    <div class="toss-track" id="toss-track">
      <div class="toss-target" id="toss-target"></div>
      <div class="toss-marker" id="toss-marker"></div>
    </div>
    <div class="toss-hint" id="toss-hint"></div>
  </div></div>
  <!-- ricomponi lo scheletro: al Museo, un pezzo nuovo si trascina nel socket giusto -->
  <div id="skfitov"><div id="skfitbox">
    <div class="sk-hd"><span id="sk-title">SCHELETRO</span><button class="sk-x" id="sk-skip">Salta</button></div>
    <div class="sk-board" id="sk-board">
      <div class="sk-sock" id="sk-s-corno" data-sock="corno"></div>
      <div class="sk-sock" id="sk-s-cranio" data-sock="cranio"></div>
      <div class="sk-sock" id="sk-s-torace" data-sock="torace"></div>
      <div class="sk-sock" id="sk-s-zampa" data-sock="zampa"></div>
      <div class="sk-sock" id="sk-s-coda" data-sock="coda"></div>
      <div class="sk-piece" id="sk-piece"><canvas class="pv" id="sk-pv" width="36" height="30"></canvas></div>
    </div>
    <div class="sk-hint" id="sk-hint"></div>
  </div></div>
  <div id="mapov"><div id="mapbox">
    <div class="mp-roll top"></div>
    <div class="mp-paper">
      <div class="mp-hd"><span id="mp-title">MAPPA</span><span id="mp-sub"></span><button class="mp-x" id="mp-close">✕</button></div>
      <div class="mp-view"><canvas id="mapcv"></canvas>
        <div class="mp-zoom"><button id="mp-in">+</button><button id="mp-out">−</button><button id="mp-home">◎</button></div>
      </div>
      <div class="mp-foot"><button class="mp-legbtn" id="mp-legbtn">?</button><button class="mp-homebtn" id="mp-gohome" hidden></button></div>
      <div class="mp-legend" id="mp-legend"></div>
    </div>
    <div class="mp-roll bot"></div>
  </div></div>
  <div id="bookov">
    <div id="bookframe">
      <button class="x" id="bk-close">✕</button>
      <div id="bk-book">
        <div class="bk-edge" id="bk-edge-l"></div>
        <div id="bk-pages"></div>
        <div class="bk-edge" id="bk-edge-r"></div>
      </div>
      <div id="bk-nav"></div>
    </div>
  </div>

  <!-- I TOAST STANNO FUORI DA TUTTO. Erano dentro il riquadro del gioco, che è
       `position:fixed` e quindi crea uno strato suo: lì dentro il loro z-index 900 vale solo
       fra i fratelli, e la splash (che è fuori) ci passava sopra comunque. Un avviso che non
       si vede è peggio di nessun avviso, perché si crede che il gioco non abbia fatto niente.
       Qui, ultimo figlio del corpo, sono sopra a tutto per davvero — e c'è un e2e che lo
       chiede al browser invece di confrontare due numeri nel foglio di stile. -->
  <div id="toasts"></div>

  <div id="splash">
    <div class="sp-wrap">
    <canvas id="sp-fossil" width="150" height="100" aria-hidden="true"></canvas>
    <div class="sp-card">
      <canvas id="sp-digsy" width="40" height="52"></canvas>
      <h1 class="sp-title">DIGSY<em>WORLD</em></h1>
      <div class="sp-sub">esplora · scava · scopri</div>
      <div id="sp-menu" class="sp-menu"></div>
      <div class="sp-ver" id="sp-ver"></div>
    </div>
    </div>
  </div>

  <div id="boot"><div style="font-size:20px;font-weight:800">Digsy World</div><div id="bootmsg" style="margin-top:8px;color:#9fb0bb">Genero il mondo…</div></div>
  <!-- Questa schermata si vede PRIMA che i moduli siano caricati, quindi tr() non esiste
       ancora: la lingua si legge direttamente dalla stessa chiave che usa i18n.js. Poche
       righe, ma è l'unica cosa che un russo vede per primo. -->
  <script>
    (function () {
      var L = { en: 'Generating the world…', ru: 'Создаю мир…' };
      try { var l = localStorage.getItem('digsy_lang') || 'en'; if (L[l]) document.getElementById('bootmsg').textContent = L[l]; }
      catch (e) { /* niente localStorage: resta il testo scritto nel markup */ }
    })();
  </script>

  <!-- Identificativo dell'applicazione presso Google, per il pulsante "Entra con Google".
       NON è un segreto: sta comunque nella pagina, visibile a chiunque. La sicurezza non sta
       nel tenerlo nascosto ma nel fatto che il SERVER verifica che ogni accesso sia stato
       emesso proprio per questo identificativo (server/lib/google.php). -->
  <script>
    window.DIGSY_GOOGLE_CLIENT_ID = '559603252887-aft20s0l2oabi9b3dr5p9efk91oufvtb.apps.googleusercontent.com';
    /* INTERRUTTORE DEL SALVATAGGIO IN CLOUD.
       Finché è false la voce "La tua partita" non compare nel menu: senza database sul
       server l'accesso fallirebbe, e un tester si troverebbe davanti un errore che non
       sa spiegarsi. Il gioco intanto funziona come sempre, salvando in locale.
       Per accenderlo basta mettere true QUI, direttamente sul server: nessuna
       ricompilazione, nessun aggiornamento da far scaricare a nessuno.
       ACCESO il 20 luglio 2026: database e API verificati su digsy.dev-box.it. */
    window.DIGSY_CLOUD = true;
    /* Percorso ASSOLUTO dell'API (/server/), non relativo: così vale ovunque stia servita la
       pagina e non dipende da dove vive il gioco. */
    window.DIGSY_API = '/server/api';
    /* DOVE FUNZIONA L'ACCESSO GOOGLE. Google emette il token SOLO per le "origini JavaScript
       autorizzate" registrate nella Console (qui digsy.dev-box.it; localhost lo aggiunge il
       codice in sviluppo). Da qualunque altra origine — l'iframe di itch, un mirror, la
       CDN a cui itch serve il gioco a schermo intero — Google risponde con un popup di errore
       "origin_mismatch / non conforme a OAuth 2.0". Da lì non si può fare NIENTE: le origini di
       itch cambiano e non si possono autorizzare. Quindi su quelle origini non si mostra un
       pulsante rotto: si spiega e si offre il link al sito vero. localhost resta sempre ok. */
    window.DIGSY_LOGIN_ORIGINS = ['https://digsy.dev-box.it'];
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
